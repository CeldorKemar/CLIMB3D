services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: climbed
      POSTGRES_USER: climbed
      POSTGRES_PASSWORD: ${CLIMBED_LOCAL_DB_PASSWORD:?Set CLIMBED_LOCAL_DB_PASSWORD for this development-only database}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - climbed_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climbed -d climbed"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  climbed_postgres:
